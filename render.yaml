# Render blueprint: one Docker web service. FalkorDB runs elsewhere (FalkorDB Cloud or a VM); give it via the env vars below.
services:
  - type: web
    name: blindspot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: FALKORDB_HOST, sync: false }
      - { key: FALKORDB_PORT, sync: false }
      - { key: FALKORDB_USER, sync: false }
      - { key: FALKORDB_PASSWORD, sync: false }
      - { key: FALKORDB_SSL, value: "1" }
      - { key: LLM_MODELS, value: "gemini/gemini-3.7-flash,gemini/gemini-3.6-flash" }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GITHUB_TOKEN, sync: false }
      - { key: PRELOAD_LLM, value: "0" }  # free tier has 512 MB: load the LLM library on first Ask instead of at startup
